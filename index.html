<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水墨古风网页</title>
    <style>
        /* 全局样式重置 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: "KaiTi", "楷体", "STKaiti", serif; /* 强制使用楷体，更符合古风 */
        }

        /* 背景容器 */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* 确保背景在最底层 */
            
            /* 核心背景设置 */
            background-image: url('your-image.jpg'); /* 替换成你的图片路径 */
            background-size: cover; /* 保持比例填满屏幕 */
            background-position: center; /* 居中显示 */
            background-repeat: no-repeat;
            
            /* 滤镜处理：让背景稍微模糊一点，增加景深感 */
            filter: blur(2px) sepia(0.2) brightness(0.7); 
            /* sepia(0.2) 增加一点怀旧褐色，brightness(0.7) 压暗图片 */
        }

        /* 宣纸纹理叠加层 (可选，增加质感) */
        .paper-texture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            /* 使用一张透明的宣纸噪点图，或者用CSS渐变模拟 */
            background-color: rgba(245, 240, 230, 0.1); 
            pointer-events: none;
        }

        /* 内容区域示例 */
        .content {
            position: relative;
            max-width: 800px;
            margin: 100px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.85); /* 半透明白色底框，像一块绢布 */
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #dcdcdc;
            
            /* 竖排文字效果 (可选) */
            /* writing-mode: vertical-rl; */ 
            /* text-orientation: upright; */
        }

        h1 {
            color: #8B0000; /* 朱红色标题 */
            text-align: center;
            border-bottom: 2px solid #8B0000;
            padding-bottom: 10px;
        }

        p {
            color: #333;
            line-height: 1.8;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- 背景层 -->
    <div class="background-container"></div>
    <div class="paper-texture"></div>

    <!-- 内容层 -->
    <div class="content">
        <h1>关外忽传收辽左</h1>
        <p>时局动荡，辽东一带终于重归大明版图。百姓箪食壶浆，以迎王师。</p >
        <p>此处为网页正文内容。为了配合背景的厚重感，正文区域建议使用半透明的浅色色块衬托，既能看清文字，又能隐约透出背后的水墨山水。</p >
    </div>

</body>
</html>
